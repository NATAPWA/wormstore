<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пульс Червяка — Статистика</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🐛 Пульс Червяка</h1>
        <p><a href="/" style="color: #58a6ff;">← Назад в магазин</a></p>
    </header>
    <main style="max-width: 500px; margin: 0 auto; padding: 20px; text-align: center;">
        <div class="counter-box" style="background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 40px 20px; margin-bottom: 30px;">
            <p style="color: #8b949e; margin: 0 0 10px;">Уникальных посетителей:</p>
            <p id="visitorCount" style="font-size: 48px; font-weight: bold; color: #4caf50; margin: 0;">...</p>
        </div>
        <p style="color: #8b949e; font-size: 14px;">
            Счётчик обновляется при каждом новом госте.<br>
            Данные хранятся глобально.
        </p>
    </main>
    <footer>
        <p>🐛 Червяк Jobs. Stay hungry, stay wormy.</p>
    </footer>
    <script>
        // Уникальный ключ для нашего проекта в CountAPI
        const NAMESPACE = 'wormstore';
        const KEY = 'visitors';

        async function fetchCount() {
            try {
                // Увеличиваем счётчик при заходе (только если ещё не считали в этой сессии)
                if (!sessionStorage.getItem('counted')) {
                    const response = await fetch(`https://api.countapi.xyz/hit/${NAMESPACE}/${KEY}`);
                    const data = await response.json();
                    document.getElementById('visitorCount').textContent = data.value;
                    sessionStorage.setItem('counted', 'true');
                } else {
                    // Просто получаем текущее значение
                    const response = await fetch(`https://api.countapi.xyz/get/${NAMESPACE}/${KEY}`);
                    const data = await response.json();
                    document.getElementById('visitorCount').textContent = data.value;
                }
            } catch (error) {
                document.getElementById('visitorCount').textContent = '—';
                console.error('Ошибка загрузки счётчика:', error);
            }
        }

        fetchCount();
        // Автообновление каждые 30 секунд
        setInterval(fetchCount, 30000);
    </script>
</body>
</html>
