<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пульс Червяка — Статистика</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @keyframes pulse {
            0% { transform: scale(1); }
            15% { transform: scale(1.08); }
            30% { transform: scale(1); }
            45% { transform: scale(1.04); }
            60% { transform: scale(1); }
            100% { transform: scale(1); }
        }
        .big-counter {
            font-size: 120px;
            font-weight: 900;
            color: #4caf50;
            text-shadow: 0 0 30px rgba(76, 175, 80, 0.6);
            margin: 30px 0;
            animation: pulse 2s infinite;
            cursor: default;
            user-select: none;
        }
        .hint {
            color: #8b949e;
            font-size: 16px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🐛 Пульс Червяка</h1>
        <p><a href="/" style="color: #58a6ff;">← Назад в магазин</a></p>
    </header>
    <main style="max-width: 500px; margin: 0 auto; padding: 20px; text-align: center;">
        <div class="counter-box" style="background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 20px;">
            <p style="color: #8b949e; margin: 0;">Уникальных посетителей:</p>
            <div id="visitorCount" class="big-counter">…</div>
            <p class="hint">Червяк растёт с каждым гостем! 🐛💚</p>
        </div>
        <p style="color: #8b949e; font-size: 14px; margin-top: 20px;">
            Скоро здесь можно будет «топать» и зарабатывать очки.<br>
            А пока — просто смотри, как бьётся сердце проекта.
        </p>
        <p style="margin-top: 20px;">
            <a href="admin.html" style="color: #8b949e; text-decoration: none; font-size: 12px;">🔒 Админка</a>
        </p>
    </main>
    <footer>
        <p>🐛 Червяк Jobs. Stay hungry, stay wormy.</p>
    </footer>
    <script>
        const NAMESPACE = 'wormstore';
        const KEY = 'visitors';
        const LOCAL_COUNT_KEY = 'wormstore_local_total';

        function getLocalCount() {
            return parseInt(localStorage.getItem(LOCAL_COUNT_KEY) || '0');
        }

        function incrementLocalCount() {
            if (!sessionStorage.getItem('counted')) {
                let count = getLocalCount() + 1;
                localStorage.setItem(LOCAL_COUNT_KEY, count.toString());
                sessionStorage.setItem('counted', 'true');
            }
            return getLocalCount();
        }

        async function fetchGlobalCount() {
            try {
                const response = await fetch(`https://api.countapi.xyz/get/${NAMESPACE}/${KEY}`);
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                return data.value;
            } catch (error) {
                console.warn('Не удалось получить глобальный счётчик, используем локальный', error);
                return null;
            }
        }

        async function updateDisplay() {
            const countElement = document.getElementById('visitorCount');
            
            // Пробуем получить глобальное значение
            const globalCount = await fetchGlobalCount();
            
            if (globalCount !== null) {
                // Глобальный счётчик доступен – показываем его
                countElement.textContent = globalCount;
                // При первом заходе увеличиваем глобальный счётчик (только если ещё не считали)
                if (!sessionStorage.getItem('counted')) {
                    try {
                        await fetch(`https://api.countapi.xyz/hit/${NAMESPACE}/${KEY}`);
                        sessionStorage.setItem('counted', 'true');
                        // Обновляем отображение сразу после hit
                        const newResponse = await fetch(`https://api.countapi.xyz/get/${NAMESPACE}/${KEY}`);
                        const newData = await newResponse.json();
                        countElement.textContent = newData.value;
                    } catch (e) {
                        // не страшно, просто покажем старое значение
                    }
                }
            } else {
                // Глобальный счётчик недоступен – увеличиваем локальный и показываем его
                const local = incrementLocalCount();
                countElement.textContent = local;
            }
        }

        updateDisplay();
        // Автообновление каждые 30 секунд
        setInterval(updateDisplay, 30000);
    </script>
</body>
</html>
